<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0e0e16">
<title>Ember Brigade</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="wrap">
  <canvas id="game" width="320" height="180" aria-label="Ember Brigade game screen"></canvas>
  <div id="touch" hidden>
    <div id="stick"><div id="knob"></div></div>
    <div class="tb" id="bGren"><span>BOMB</span></div>
    <div class="tb" id="bFire"><span>FIRE</span></div>
    <div class="tb" id="bJump"><span>JUMP</span></div>
  </div>
  <div id="bPause" hidden aria-label="Pause"><i></i><i></i></div>
</div>
<script src="js/core.js"></script>
<script src="js/sprites.js"></script>
<script src="js/audio.js"></script>
<script src="js/input.js"></script>
<script src="js/themes.js"></script>
<script src="js/levels.js"></script>
<script src="js/entities.js"></script>
<script src="js/bosses.js"></script>
<script src="js/game.js"></script>
</body>
</html>
